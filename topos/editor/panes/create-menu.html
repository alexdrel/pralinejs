<button class="icon-btn" type="button" title="Create elements">
  <span>Create</span> <span class="btn-glyph" style="font-size: 0.6rem; margin-left: 2px;">▼</span>
</button>
<div class="menu-content" hidden>
  <button onClick="{{createBox}}" class="menu-item-btn" type="button" title="Create Box">
    <span class="menu-item-title">
      <span class="btn-glyph">□</span>
      <span>Box</span>
    </span>
    <kbd class="menu-key">B</kbd>
    <span class="menu-item-hint">⌘-drag</span>
  </button>
  <button onClick="{{createText}}" class="menu-item-btn" type="button" title="Create Text">
    <span class="menu-item-title">
      <span class="btn-glyph">✎</span>
      <span>Text</span>
    </span>
    <kbd class="menu-key">T</kbd>
    <span class="menu-item-hint">dblclick</span>
  </button>
  <button onClick="{{createHub}}" class="menu-item-btn" type="button" title="Create Hub">
    <span class="menu-item-title">
      <span class="btn-glyph">●</span>
      <span>Hub</span>
    </span>
    <kbd class="menu-key">H</kbd>
    <span class="menu-item-hint">⌥-click</span>
  </button>
  <button onClick="{{createLine}}" class="menu-item-btn" type="button" title="Create Line">
    <span class="menu-item-title">
      <span class="btn-glyph">→</span>
      <span>Line</span>
    </span>
    <kbd class="menu-key">L</kbd>
    <span class="menu-item-hint">⌥-drag</span>
  </button>
</div>
