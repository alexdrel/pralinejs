<header ref="{{panelToolbar}}" class="enamel-header">
  <div data-panel-mode="side" class="pane-head-toggle">Preview</div>
  <h2 data-panel-mode="main" class="surface-title">SVG View</h2>
  <div class="controls">
    <button ref="{{zoom.out}}" onClick="{{zoomOut}}" class="icon-btn zoom-btn" type="button" title="Zoom Out">−</button>
    <button ref="{{zoom.reset}}" onClick="{{resetZoom}}" class="icon-btn zoom-btn zoom-reset-btn" type="button" title="Toggle fit / actual size">100%</button>
    <button ref="{{zoom.in}}" onClick="{{zoomIn}}" class="icon-btn zoom-btn" type="button" title="Zoom In">+</button>
    <button ref="{{paperBtn}}" onClick="{{cyclePaper}}" class="icon-btn paper-btn" type="button" title="Enamel background (click to cycle)"></button>
    <button ref="{{overrideBtn}}" onClick="{{toggleOverride}}" class="icon-btn toggle-btn override-btn" type="button" title="Override">!</button>
    <span data-panel-mode="main" class="control-separator">|</span>
    <div data-panel-mode="main" ref="{{exportMenuDropdown}}" class="dropdown"></div>
  </div>
</header>
<div ref="{{panelBody}}" class="enamel-pane"></div>
