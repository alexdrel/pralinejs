<header ref="{{panelToolbar}}" class="slate-header">
  <div class="left">
    <h2 class="surface-title">Slate</h2>
    <button onClick="{{toggleHelp}}" class="icon-btn cheatsheet-toggle-btn" type="button" title="Keyboard Shortcuts & Gestures Help (?)">
      <span class="btn-glyph">?</span>
    </button>
  </div>
  <div class="tools">
    <button onClick="{{toggleReplay}}" class="icon-btn" type="button" title="Replay trace">
      <span class="btn-glyph">🐜</span>
      <span>Replay</span>
    </button>
  </div>
  <div class="edit-controls">
    <span ref="{{slateStatus}}" class="status"></span>
    <div ref="{{editMenuDropdown}}" class="dropdown"></div>
    <div class="create-actions">
      <div ref="{{createMenuDropdown}}" class="dropdown"></div>
    </div>
  </div>
</header>
<div ref="{{panelBody}}" class="slate-pane slate-surface surface-mono"></div>
