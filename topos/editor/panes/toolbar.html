<div class="topbar-actions">
  <button onClick="{{newDocument}}" class="icon-btn" type="button" title="New document"><span class="btn-glyph">＋</span><span>New</span></button>
  <button ref="{{copyAllBtn}}" onClick="{{copyAll}}" class="icon-btn" type="button" title="Copy Map and Legend to Clipboard">
    <span class="btn-glyph">📋</span>
    <span>Copy Topos</span>
  </button>
  <button ref="{{pasteAllBtn}}" onClick="{{pasteAll}}" class="icon-btn" type="button" title="Replace with Topos from Clipboard">
    <span class="btn-glyph">📥</span>
    <span>Paste Topos</span>
  </button>
</div>
<div class="diagram-controls">
  <div id="diagram-menu" ref="{{diagram.menu}}" class="dropdown">
    <button class="icon-btn diagram-menu-btn" type="button" title="Diagram library">
      <span ref="{{diagram.icon}}" class="btn-glyph">📄</span><span id="document-name" ref="{{diagram.name}}">Untitled</span>
      <span class="btn-glyph" style="font-size: 0.6rem; margin-left: 2px;">▼</span>
    </button>
    <div class="menu-content diagram-menu-content" hidden>
      <button onClick="{{openDiagram}}" class="menu-item-btn" type="button" data-url="/__topos/compendium" data-name="compendium">
        <span class="btn-glyph">📚</span><span>Compendium</span>
      </button>
      <template ref="{{diagramItem}}">
        <button onClick="{{openDiagram}}" class="menu-item-btn {{groupClass}}" type="button" data-url="{{url}}" data-name="{{name}}">
          <span class="btn-glyph">{{icon}}</span><span>{{name}}</span>
        </button>
      </template>
    </div>
  </div>
  <button ref="{{diagram.reload}}" onClick="{{reloadDiagram}}" class="icon-btn" type="button" title="Reload current diagram" disabled>
    <span class="btn-glyph">↻</span><span>Reload</span>
  </button>
</div>
<div class="topbar-actions">
  <button ref="{{sourceFocusBtn}}" onClick="{{toggleSource}}" class="icon-btn toggle-btn" type="button" aria-pressed="false" title="Edit raw Topos source">
    <span class="btn-glyph">⌨</span>
    <span>Source</span>
  </button>
  <button ref="{{svgFocusBtn}}" onClick="{{toggleSvg}}" class="icon-btn toggle-btn" type="button" aria-pressed="false" title="Show SVG on the main panel">
    <span class="btn-glyph">◧</span>
    <span>SVG View</span>
  </button>
</div>
<div class="topbar-meta">
  <button ref="{{exportMonoBtn}}" onClick="{{exportMono}}" class="icon-btn" type="button" title="Export to Monosketch">
    <span class="btn-glyph">↗</span>
    <span>Monosketch</span>
  </button>
  <div ref="{{fontMenu}}" class="dropdown">
    <button class="icon-btn" type="button" title="Editor Font">
      <span>Font: <span class="choice-label"></span></span> <span class="btn-glyph" style="font-size: 0.6rem; margin-left: 2px;">▼</span>
    </button>
    <div id="font-menu-content" class="menu-content" hidden>
      <template ref="{{fontItem}}">
        <button class="menu-item-btn font-option-btn" data-value="{{value}}" style="font-family: {{fontFamily}};">{{label}}</button>
      </template>
    </div>
  </div>

  <div ref="{{themeMenu}}" class="dropdown">
    <button class="icon-btn" type="button" title="Editor Theme">
      <span>Theme: <span class="choice-label"></span></span> <span class="btn-glyph" style="font-size: 0.6rem; margin-left: 2px;">▼</span>
    </button>
    <div id="theme-menu-content" class="menu-content" hidden>
      <template ref="{{themeItem}}">
        <button class="menu-item-btn" data-value="{{value}}">
          <span class="menu-item-title">
            <span class="theme-color-preview" style="{{previewStyle}}"></span>
            <span>{{label}}</span>
          </span>
        </button>
      </template>
    </div>
  </div>
</div>
